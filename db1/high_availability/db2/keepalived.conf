global_defs {
    router_id DB2
    enable_script_security
}

vrrp_script chk_mariadb {
    script "/usr/local/bin/check_mariadb.sh"
    user root
    interval 2
    fall 2
    rise 2
    weight 0
}

vrrp_instance VI_DB {
    state BACKUP
    interface ens160
    virtual_router_id 51
    priority 100
    advert_int 1

    nopreempt

    unicast_src_ip 40.40.4.3
    unicast_peer {
        40.40.4.2
    }

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME
    }

    virtual_ipaddress {
        40.40.4.100/24
    }

    track_script {
        chk_mariadb
    }
    notify_master "/usr/local/bin/db_master.sh" root
    notify_backup "/usr/local/bin/db_backup.sh" root
}
