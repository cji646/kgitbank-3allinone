<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tourist Emergency Button</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                "Montserrat",
                "Noto Sans KR",
                sans-serif;

            background: #f7f8fa;

            color: #222;
        }


        /* ======================
           HEADER
        ====================== */

        header {

            height: 78px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            background: white;

            border-bottom:
                1px solid #e8e8e8;

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            font-weight: 800;

            color: #26456c;

        }


        .logo-mark {

            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 11px;

            background: #2d6cc0;

            color: white;

            font-size: 22px;

            box-shadow:
                0 5px 15px
                rgba(45,108,192,0.3);

        }


        .site-title {

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            font-size: 24px;

            font-weight: 800;

            color: #294366;

        }


        .header-right {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .language-select {

            padding: 10px 15px;

            border-radius: 10px;

            border:
                1px solid #dddddd;

            background: white;

            cursor: pointer;

            outline: none;

        }


/* ======================
   LANGUAGE
====================== */

.language-select {

    padding: 10px 15px;

    border-radius: 10px;

    border: 1px solid #dddddd;

    background: white;

    cursor: pointer;

    outline: none;

}


/* ======================
   ACCOUNT AREA
====================== */

.account-bar {

    padding: 18px 7% 0;

    display: flex;

    justify-content: flex-end;

    align-items: center;

}


.account-actions {

    display: flex;

    justify-content: flex-end;

    align-items: center;

}


.user-info {

    padding: 10px 16px;

    border: 1px solid #dddddd;

    border-radius: 10px;

    background: #ffffff;

    color: #333333;

    font-weight: 700;

    line-height: 20px;

}


.account-btn {

    padding: 11px 20px;

    margin-left: 10px;

    border-radius: 10px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.25s;

    font-family: inherit;

}


.primary-btn {

    border: none;

    background: #2d6cc0;

    color: white;

}


.primary-btn:hover {

    background: #1f579f;

    transform: translateY(-2px);

}


.secondary-btn {

    border: 1px solid #2d6cc0;

    background: white;

    color: #2d6cc0;

}


.secondary-btn:hover {

    background: #eef5ff;

    transform: translateY(-2px);

}


        /* ======================
           MAIN
        ====================== */

        .hero {

            padding:
                75px 7%
                100px;

            text-align: center;

        }


        .hero h1 {

            font-size: 42px;

            color: #2d62ae;

            margin-bottom: 18px;

        }


        .hero p {

            color: #666;

            font-size: 17px;

            line-height: 1.8;

        }

/* ======================
   COUNTRY CARDS
====================== */

.country-container {

    width: 100%;

    max-width: 1200px;

    margin: 60px auto 0;

    padding: 0 20px;

    display: grid;

    /* 한국 · 일본 · 베트남 좌우 배치 */
    grid-template-columns: repeat(3, minmax(0, 1fr));

    gap: 24px;

    align-items: stretch;

}


/* 국가 카드 */

.country-card {

    width: 100%;

    /* 모든 카드를 세로형으로 고정 */
    height: 500px;

    min-width: 0;

    border-radius: 20px;

    overflow: hidden;

    position: relative;

    cursor: pointer;

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    color: white;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.15);

}


/* 대한민국 */

.korea-card {

    background-image:
        linear-gradient(
            to top,
            rgba(0, 40, 100, 0.75),
            rgba(0, 40, 100, 0.1)
        ),
        url("images/korea.jpg");

}


/* 일본 */

.japan-card {

    background-image:
        linear-gradient(
            to top,
            rgba(100, 20, 60, 0.75),
            rgba(100, 20, 60, 0.1)
        ),
        url("images/japan.jpg");

}


/* 베트남 */

.vietnam-card {

    background-image:
        linear-gradient(
            to top,
            rgba(80, 50, 20, 0.75),
            rgba(80, 50, 20, 0.1)
        ),
        url("images/vietnam.jpg");

}


/* 카드 마우스 효과 */

.country-card:hover {

    transform:
        translateY(-10px)
        scale(1.03);

    box-shadow:
        0 20px 40px
        rgba(0, 0, 0, 0.25);

}


/* 어두운 효과 */

.country-card::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to top,
            rgba(0, 0, 0, 0.75),
            rgba(0, 0, 0, 0.05)
        );

    z-index: 1;

}


/* 카드 내부 글자 */

.country-content {

    position: absolute;

    left: 30px;

    bottom: 30px;

    z-index: 2;

    color: white;

}


.country-content h2 {

    font-size: 28px;

    margin-bottom: 12px;

}


.country-content p {

    font-size: 14px;

    color: white;

    line-height: 1.6;

    margin-bottom: 20px;

}


.country-link {

    font-weight: bold;

    font-size: 14px;

}}



        footer {

            padding: 35px;

            text-align: center;

            background: white;

            border-top:
                1px solid #e8e8e8;

            color: #777;

            font-size: 13px;

        }


        @media
        (max-width: 900px) {

            .country-container {


            }


            .site-title {

                position: static;

                transform: none;

                font-size: 18px;

            }


            header {

                padding: 0 20px;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        <div class="logo-mark">
            ✓
        </div>

        <span data-i18n="globalSafety">
            GLOBAL SAFETY
        </span>

    </div>


    <div
        class="site-title"
        data-i18n="siteTitle">

        Tourist Emergency Button

    </div>


<div class="header-right">

<!-- 언어 선택 -->
<select
    class="language-select"
    onchange="changeLanguage(this.value)">

    <option value="ko">한국어</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="zh">中文</option>

</select>

</header>


<!-- 로그인 사용자 메뉴 -->
<div class="account-bar">

    <div id="authArea" class="account-actions">

        <!-- 비로그인 상태 -->
        <button
            id="loginBtn"
            type="button"
            class="account-btn primary-btn"
            onclick="location.href='login.html'"
            data-i18n="login">
            로그인
        </button>


        <!-- 로그인 상태 -->
        <span
            id="userInfo"
            class="user-info"
            style="display:none;">
        </span>


        <button
            id="favoriteBtn"
            type="button"
            class="account-btn secondary-btn"
            onclick="goFavoriteCountry()"
            style="display:none;">
            ☆ 관심 국가
        </button>


        <button
            id="logoutBtn"
            type="button"
            class="account-btn primary-btn"
            style="display:none;">
            로그아웃
        </button>

    </div>

</div>

</header>



<main class="hero">


    <h1 data-i18n="mainTitle">

        Tourist Emergency Button

    </h1>


    <p data-i18n="mainDescription">

        여행지의 안전정보를 한눈에 확인하세요.<br>
        국가별 긴급 연락처와 안전시설 정보를 제공합니다.

    </p>



    <div class="country-container">


        <!-- KOREA -->

	<div class="country-card korea-card"
     		onclick="location.href='korea.html'">

    		<div class="country-content">

        	<h2 data-i18n="korea">
            	KOREA
        	</h2>

        	<p data-i18n="koreaDesc">
           	 대한민국 여행 안전정보와 긴급 연락처를 확인하세요.
        	</p>

        	<span data-i18n="checkSafety">
            	안전정보 확인 →
            </span>

        </div>

    </div>




<!-- JAPAN -->
    <div class="country-card japan-card"
         onclick="location.href='japan.html'">

        <div class="country-content">

            <h2 data-i18n="japan">
                JAPAN
            </h2>

            <p data-i18n="japanDesc">
                일본 여행 안전정보와 긴급 연락처를 확인하세요.
            </p>

            <span class="country-link"
                  data-i18n="checkSafety">
                안전정보 확인 →
            </span>

        </div>

    </div>


    <!-- VIETNAM -->
    <div class="country-card vietnam-card"
         onclick="location.href='vietnam.html'">

        <div class="country-content">

            <h2 data-i18n="vietnam">
                VIETNAM
            </h2>

            <p data-i18n="vietnamDesc">
                베트남 여행 안전정보와 긴급 연락처를 확인하세요.
            </p>

            <span class="country-link"
                  data-i18n="checkSafety">
                안전정보 확인 →
            </span>

        </div>

    </div>

</div>


</main>



<footer>

    © 2026 Tourist Emergency Button

</footer>


<script src="js/language.js"></script>

<script>
(function() {

    var loginBtn = document.getElementById("loginBtn");
    var logoutBtn = document.getElementById("logoutBtn");
    var userInfo = document.getElementById("userInfo");
    var favoriteBtn = document.getElementById("favoriteBtn");

    function checkLogin() {

        var xhr = new XMLHttpRequest();

        xhr.open("GET", "/me", true);
        xhr.withCredentials = true;

        xhr.onreadystatechange = function() {

            if (xhr.readyState !== 4) {
                return;
            }

            if (xhr.status === 200) {

                var data;

                try {
                    data = JSON.parse(xhr.responseText);
                } catch (e) {
                    return;
                }

                loginBtn.style.display = "none";
                logoutBtn.style.display = "inline-block";
                userInfo.style.display = "inline-block";
		favoriteBtn.style.display = "inline-block";

                if (data.user && data.user.name) {
                    userInfo.innerHTML = data.user.name + "님";
                } else if (data.name) {
                    userInfo.innerHTML = data.name + "님";
                } else {
                    userInfo.innerHTML = "로그인 중";
                }

            } else {

                loginBtn.style.display = "inline-block";
                logoutBtn.style.display = "none";
                userInfo.style.display = "none";
		favoriteBtn.style.display = "none";
            }
        };

        xhr.send();
    }

    logoutBtn.addEventListener("click", function() {

        var xhr = new XMLHttpRequest();

        xhr.open("POST", "/logout", true);
        xhr.withCredentials = true;

        xhr.onreadystatechange = function() {

            if (xhr.readyState !== 4) {
                return;
            }

            if (xhr.status === 200) {
                alert("로그아웃되었습니다.");
                location.reload();
            } else {
                alert("로그아웃에 실패했습니다.");
            }
        };

        xhr.send();
    });

    checkLogin();

})();

</script>

<script src="js/language.js"></script>
<script src="js/favorite.js"></script>

</body>

</html>
