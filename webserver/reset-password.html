<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tourist Emergency Button</title>

<style>

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}

body {

    font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

    background:
    #f7f8fa;

    color:
    #333;

}


header {

    height: 75px;

    padding:
    0 7%;

    display: flex;

    align-items: center;

    justify-content:
    space-between;

    background:
    white;

    border-bottom:
    1px solid #e5e5e5;

}


.site-title {

    font-size:
    20px;

    font-weight:
    700;

    color:
    #2f5f9f;

    cursor:
    pointer;

}


.header-right {

    display:
    flex;

    gap:
    10px;

}


.language-select {

    padding:
    10px 15px;

    border:
    1px solid #ddd;

    border-radius:
    8px;

    background:
    white;

}


.container {

    max-width:
    450px;

    margin:
    70px auto;

    padding:
    45px;

    background:
    white;

    border-radius:
    20px;

    box-shadow:
    0 10px 40px
    rgba(0,0,0,0.08);

}


h1 {

    text-align:
    center;

    margin-bottom:
    35px;

    color:
    #2f5f9f;

}


input {

    width:
    100%;

    padding:
    16px;

    margin-bottom:
    15px;

    border:
    1px solid #ddd;

    border-radius:
    10px;

}


.login-button {

    width:
    100%;

    padding:
    16px;

    border:
    none;

    border-radius:
    10px;

    background:
    #2f6fbd;

    color:
    white;

    font-size:
    16px;

    font-weight:
    700;

    cursor:
    pointer;

}


.login-links {

    display:
    flex;

    justify-content:
    center;

    align-items:
    center;

    gap:
    10px;

    margin-top:
    25px;

}


.login-links button {

    border:
    none;

    background:
    none;

    cursor:
    pointer;

    color:
    #555;

}


.login-links button:hover {

    color:
    #2f6fbd;

    font-weight:
    700;

}

</style>

</head>


<body>


<header>

<div
class="site-title"
onclick="location.href='index.html'"
data-i18n="siteTitle">

Tourist Emergency Button

</div>


<div class="header-right">

<select
class="language-select"
onchange="changeLanguage(this.value)">

<option value="ko">
한국어
</option>

<option value="en">
English
</option>

<option value="ja">
日本語
</option>

<option value="zh">
中文
</option>

</select>

</div>

</header>


<div class="container">

    <!-- 1단계 : 사용자 정보 확인 -->

<div id="verifyStep">

    <h1 data-i18n="resetPassword">
        비밀번호 재설정
    </h1>

    <p
        style="margin-bottom: 25px; color: #666; text-align: center;"
        data-i18n="resetPasswordDescription">
        비밀번호 재설정을 위해 회원정보를 입력해주세요.
    </p>

    <label data-i18n="usernameEmail">
        아이디(이메일)
    </label>

    <input
        id="resetEmail"
        type="email"
	data-i18n-placeholder="usernamePlaceholder"
        placeholder="이메일을 입력하세요">

    <label data-i18n="name">
        이름
    </label>

    <input
        id="resetName"
        type="text"
    	data-i18n-placeholder="namePlaceholder"
        placeholder="이름을 입력하세요">

    <button
        id="verifyButton"
        type="button"
        class="login-button"
        onclick="verifyUser()"
        data-i18n="verifyInformation">
        정보 확인
    </button>

    <div class="login-links">

        <button
            type="button"
            onclick="location.href='login.html'"
            data-i18n="backToLogin">
            로그인으로 돌아가기
        </button>

    </div>

</div>

    <!-- 2단계 : 새 비밀번호 설정 -->

<div id="passwordStep" style="display:none;">

    <h1 data-i18n="newPasswordTitle">
        새 비밀번호 설정
    </h1>

    <p
        style="margin-bottom: 25px; color: #666; text-align: center;"
        data-i18n="newPasswordDescription">
        새로 사용할 비밀번호를 입력해주세요.
    </p>

    <label data-i18n="newPassword">
        새 비밀번호
    </label>

    <input
        id="newPassword"
        type="password"
        data-i18n-placeholder="newPasswordPlaceholder"
        placeholder="새 비밀번호를 입력하세요">

    <label data-i18n="confirmNewPassword">
        새 비밀번호 재입력
    </label>

    <input
        id="confirmPassword"
        type="password"
        data-i18n-placeholder="confirmNewPasswordPlaceholder"
        placeholder="새 비밀번호를 다시 입력하세요">

    <button
        id="resetButton"
        type="button"
        class="login-button"
        onclick="resetPassword()"
        data-i18n="changePassword">
        비밀번호 변경
    </button>

    <div class="login-links">

        <button
            type="button"
            onclick="showVerifyStep()"
            data-i18n="back">
            이전으로
        </button>

        <span>|</span>

        <button
            type="button"
            onclick="location.href='login.html'"
            data-i18n="backToLogin">
            로그인으로 돌아가기
        </button>

    </div>

</div>



<script>

/*
 * 1단계 : 회원정보 확인
 *
 * 현재 WAS API가 없으므로
 * 화면 동작만 임시로 구현
 */
function verifyUser() {

    var email =
        document.getElementById("resetEmail").value;

    var name =
        document.getElementById("resetName").value;

    if (!email || !name) {
        alert("아이디(이메일)와 이름을 입력해주세요.");
        return;
    }

    /*
     * 추후 WAS 회원정보 확인 API 연결 위치
     */

    document.getElementById("verifyStep").style.display = "none";
    document.getElementById("passwordStep").style.display = "block";
}


/*
 * 2단계 : 비밀번호 변경
 *
 * 현재는 입력값 검증만 수행
 */
function resetPassword() {

    var password =
        document.getElementById("newPassword").value;

    var confirmPassword =
        document.getElementById("confirmPassword").value;

    if (!password || !confirmPassword) {
        alert("새 비밀번호와 비밀번호 재입력을 모두 입력해주세요.");
        return;
    }

    if (password !== confirmPassword) {
        alert("입력한 비밀번호가 일치하지 않습니다.");
        return;
    }

    /*
     * 회원가입과 동일한 비밀번호 정책
     * 최소 8자 / 영문 / 숫자 / 특수문자
     */

    if (password.length < 8) {
        alert("비밀번호는 최소 8자 이상이어야 합니다.");
        return;
    }

    if (!/[A-Za-z]/.test(password)) {
        alert("비밀번호에는 영문자가 포함되어야 합니다.");
        return;
    }

    if (!/[0-9]/.test(password)) {
        alert("비밀번호에는 숫자가 포함되어야 합니다.");
        return;
    }

    if (!/[^A-Za-z0-9]/.test(password)) {
        alert("비밀번호에는 특수문자가 반드시 포함되어야 합니다.");
        return;
    }

    /*
     * 추후 WAS 비밀번호 변경 API 연결 위치
     */

    alert("화면 확인이 완료되었습니다.\n현재 비밀번호 변경 기능은 서버 연동 전입니다.");
}


/*
 * 1단계 화면으로 돌아가기
 */
function showVerifyStep() {

    document.getElementById("passwordStep").style.display = "none";
    document.getElementById("verifyStep").style.display = "block";

}


/*
 * Enter 키 처리
 */
document.addEventListener("keydown", function(event) {

    if (event.key !== "Enter") {
        return;
    }

    event.preventDefault();

    var passwordStep =
        document.getElementById("passwordStep");

    if (passwordStep.style.display === "none") {
        verifyUser();
    } else {
        resetPassword();
    }

});

</script>

<script src="js/language.js?v=20260909-5"></script>

</body>

</html>
