<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>아이디 찾기</title>

<style>

body {

    margin: 0;

    font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

    background:
    #f6f7fb;

}


header {

    height:
    75px;

    display:
    flex;

    justify-content:
    space-between;

    align-items:
    center;

    padding:
    0 7%;

    background:
    white;

    border-bottom:
    1px solid #e5e5e5;

}


.site-title {

    font-size:
    20px;

    font-weight:
    700;

    color:
    #2f5f9f;

    cursor:
    pointer;

}


.language-select {

    padding:
    10px 15px;

    border:
    1px solid #ddd;

    border-radius:
    8px;

}


.container {

    max-width:
    450px;

    margin:
    80px auto;

    padding:
    45px;

    background:
    white;

    border-radius:
    20px;

    box-shadow:
    0 10px 40px
    rgba(0,0,0,0.08);

}


h1 {

    text-align:
    center;

    color:
    #2f5f9f;

}


.description {

    text-align:
    center;

    color:
    #777;

}


input {

    width:
    100%;

    padding:
    15px;

    margin-top:
    25px;

    box-sizing:
    border-box;

    border:
    1px solid #ddd;

    border-radius:
    10px;

}


button {

    width:
    100%;

    padding:
    16px;

    margin-top:
    15px;

    border:
    none;

    border-radius:
    10px;

    background:
    #2f6fbd;

    color:
    white;

    font-size:
    16px;

    cursor:
    pointer;

}


.result {

    margin-top:
    20px;

    text-align:
    center;

}

</style>

</head>


<body>


<header>


<div
class="site-title"
onclick="location.href='index.html'"
data-i18n="siteTitle">

Tourist Emergency Button

</div>



<select
class="language-select"
onchange="changeLanguage(this.value)">

<option value="ko">
한국어
</option>

<option value="en">
English
</option>

<option value="ja">
日本語
</option>

<option value="zh">
中文
</option>

</select>


</header>



<div class="container">


<h1 data-i18n="findIdTitle">

아이디 찾기

</h1>


<p
class="description"
data-i18n="findIdDescription">

가입한 이메일 주소를 입력하세요.

</p>



<input
type="email"
id="email"
data-i18n-placeholder="emailPlaceholder"
placeholder="이메일을 입력하세요">



<button
onclick="findId()"
data-i18n="findIdButton"

아이디 찾기

</button>



<div
class="result"
id="result">

</div>


</div>



<script src="js/language.js"></script>


<script>

function findId() {


    const email =

    document
    .getElementById("email")
    .value;


    const users =

    JSON.parse(
        localStorage.getItem("users")
    ) || [];


    const user =

    users.find(

        user =>
        user.email === email

    );


    const result =

    document
    .getElementById("result");


    const lang =

    localStorage.getItem(
        "selectedLanguage"
    ) || "ko";


    if (user) {


        result.innerHTML =

        "<strong>" +

        user.username +

        "</strong>";


    }

    else {


        result.innerText =

        translations[lang]
        .idNotFound;


    }

}

</script>


</body>

</html>
