<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tourist Emergency Button</title>

<style>

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}

body {

    font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

    background:
    #f7f8fa;

    color:
    #333;

}


header {

    height: 75px;

    padding:
    0 7%;

    display: flex;

    align-items: center;

    justify-content:
    space-between;

    background:
    white;

    border-bottom:
    1px solid #e5e5e5;

}


.site-title {

    font-size:
    20px;

    font-weight:
    700;

    color:
    #2f5f9f;

    cursor:
    pointer;

}


.header-right {

    display:
    flex;

    gap:
    10px;

}


.language-select {

    padding:
    10px 15px;

    border:
    1px solid #ddd;

    border-radius:
    8px;

    background:
    white;

}


.container {

    max-width:
    450px;

    margin:
    70px auto;

    padding:
    45px;

    background:
    white;

    border-radius:
    20px;

    box-shadow:
    0 10px 40px
    rgba(0,0,0,0.08);

}


h1 {

    text-align:
    center;

    margin-bottom:
    35px;

    color:
    #2f5f9f;

}


input {

    width:
    100%;

    padding:
    16px;

    margin-bottom:
    15px;

    border:
    1px solid #ddd;

    border-radius:
    10px;

}


.login-button {

    width:
    100%;

    padding:
    16px;

    border:
    none;

    border-radius:
    10px;

    background:
    #2f6fbd;

    color:
    white;

    font-size:
    16px;

    font-weight:
    700;

    cursor:
    pointer;

}


.login-links {

    display:
    flex;

    justify-content:
    center;

    align-items:
    center;

    gap:
    10px;

    margin-top:
    25px;

}


.login-links button {

    border:
    none;

    background:
    none;

    cursor:
    pointer;

    color:
    #555;

}


.login-links button:hover {

    color:
    #2f6fbd;

    font-weight:
    700;

}

</style>

</head>


<body>


<header>

<div
class="site-title"
onclick="location.href='index.html'"
data-i18n="siteTitle">

Tourist Emergency Button

</div>


<div class="header-right">

<select
class="language-select"
onchange="changeLanguage(this.value)">

<option value="ko">
한국어
</option>

<option value="en">
English
</option>

<option value="ja">
日本語
</option>

<option value="zh">
中文
</option>

</select>

</div>

</header>



<div class="container">


<h1 data-i18n="login">

로그인

</h1>


<label data-i18n="username">
    아이디
</label>

<input
    type="text"
    data-i18n-placeholder="loginIdPlaceholder"
    placeholder="아이디를 입력하세요">


<label data-i18n="password">
    비밀번호
</label>

<input
    type="password"
    data-i18n-placeholder="passwordPlaceholder"
    placeholder="비밀번호를 입력하세요">

<button
class="login-button"
data-i18n="loginButton">

로그인

</button>



<div class="login-links">


<button
    type="button"
    onclick="location.href='find-id.html'"
    data-i18n="findId">

    아이디 찾기

</button>


<span>|</span>


<button
    type="button"
    onclick="location.href='find-password.html'"
    data-i18n="findPassword">

    비밀번호 찾기
</button>


<span>|</span>


<button
onclick="location.href='register.html'"
data-i18n="signup">

회원가입

</button>


</div>


</div>


<script src="js/language.js"></script>

</body>

</html>
